baseURL = "https://kropath.github.io/kropath-docs/"
title = "kropath Documentation"
enableRobotsTXT = true
enableGitInfo = true
refLinksErrorLevel = "ERROR"

# Docsy needs the extended (SCSS-enabled) Hugo binary.
[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
  [[module.imports]]
    path = "github.com/google/docsy/theme"

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    contentDir = "content/en"
    weight = 1

[params]
  copyright = "kropath contributors"
  github_repo = "https://github.com/kropath/kropath-docs"
  github_branch = "main"
  # No third-party search account — start with the offline Lunr index
  # (spec §14 open question 2).
  offlineSearch = true

[params.ui]
  sidebar_menu_compact = false
  sidebar_search_disable = false
  breadcrumb_disable = false
  sidebar_menu_foldable = true
  showLightDarkModeMenu = true

[params.ui.feedback]
  enable = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[security]
  [security.funcs]
    getenv = ["^HUGO_", "^CI$"]
